version: '3.8'

services:
  # 1. The MySQL Database Container
  mysql-db:
    image: mysql:8.0
    container_name: expense_mysql
    environment:
      MYSQL_DATABASE: expense_tracker_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql 
      # THE FIX: Pointing exactly to where your script lives
      - ./src/main/resources/TableScript.sql:/docker-entrypoint-initdb.d/TableScript.sql
    networks:
      - expense-network

  # 2. The Spring Boot Application Container
  expense-backend:
    build: . 
    container_name: expense_springboot
    ports:
      - "8080:8080" 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/expense_tracker_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # THE FIX: Tell Hibernate to only validate the tables, not create them
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate 
    depends_on:
      - mysql-db 
    networks:
      - expense-network

networks:
  expense-network:

volumes:
  mysql_data: