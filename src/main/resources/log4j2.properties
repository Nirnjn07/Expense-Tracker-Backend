# Log4j2 properties configuration for ExpenseTracker
# Console + RollingFile appenders, application logger and root logger

# Basic settings
status = error
name = ExpenseTrackerLogConfig

# Log directory property (ensure this directory exists or create it before running)
property.logDir = logs

# Console appender (for development/IDE)
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# Rolling file appender (daily rollover + size-based, keep up to 30 files)
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = ${logDir}/expense-tracker.log
appender.rolling.filePattern = ${logDir}/expense-tracker-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB

appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 30

# Application logger (non-additive, logs for application package)
logger.app.name = com.ExpenseTracker
logger.app.level = debug
logger.app.additivity = false
logger.app.appenderRefs = rolling,console
logger.app.appenderRef.rolling.ref = RollingFile
logger.app.appenderRef.console.ref = ConsoleAppender

# Root logger
rootLogger.level = debug
rootLogger.appenderRefs = rolling,console
rootLogger.appenderRef.rolling.ref = RollingFile
rootLogger.appenderRef.console.ref = ConsoleAppender

# Uncomment to enable internal Log4j2 diagnostic logging to console
#status = trace

